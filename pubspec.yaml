name: air_query
description: "Air Query is an unofficial platform designed specifically for Air University students. It provides a focused space to post and answer campus-related questions, helping students navigate university life through peer-to-peer support."

publish_to: 'none'

# keep constants' version in sync with this
version: 2.8.0+17

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  # riverpod
  flutter_riverpod: ^3.2.1

  #  rename_app: ^1.6.5
  #  flutter_launcher_icons: ^0.14.4
  #  change_app_package_name: ^1.5.0
  #  flutter_native_splash: ^2.4.7

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  intl: ^0.20.2 # for time formatting
  in_app_update: ^4.2.5 # app update
  share_plus: ^12.0.1 # sharing content via share dialog
  flutter_linkify: ^6.0.0
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1

  #Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_functions: ^6.0.7
  firebase_messaging: ^16.1.2
  firebase_app_check: ^0.4.1+5
  firebase_analytics: ^12.1.3
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true


