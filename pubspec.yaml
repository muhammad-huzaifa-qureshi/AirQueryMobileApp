name: air_query
description: "An unofficial mobile app for Air University students to post and answer campus related questions in a smart and organized way."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  # riverpod
  flutter_riverpod: ^3.2.1

  #  rename_app: ^1.6.5
  #  flutter_launcher_icons: ^0.14.4
  #  change_app_package_name: ^1.5.0

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  intl: ^0.20.2 # for time formatting
  in_app_update: ^4.2.5 # app update

  #Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_functions: ^6.0.7
  firebase_messaging: ^16.1.2
  firebase_app_check: ^0.4.1+5
  firebase_analytics: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
#  assets:
#    - assets/app_icon/