name: air_query
description: "An unofficial mobile app for Air University students to post and answer campus related questions in a smart and organized way."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  # for BLOC
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  #  rename_app: ^1.6.5
  #  flutter_launcher_icons: ^0.14.4

  cupertino_icons: ^1.0.8

  #Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/app_icon/